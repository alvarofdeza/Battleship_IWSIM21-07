<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tactical Dark Base -->
  <rect width="32" height="32" rx="7" fill="#050b14" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#00ff66" stroke-width="1" stroke-opacity="0.35" />

  <!-- Concentric Naval Radar Rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00ff66" stroke-width="1.6" stroke-opacity="0.9" />
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#00ff66" stroke-width="1" stroke-opacity="0.45" />

  <!-- Crosshair Reticle -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="2 1.5" />
  <line x1="3" y1="16" x2="29" y2="16" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="2 1.5" />

  <!-- Command Center Reticle Origin -->
  <circle cx="16" cy="16" r="2" fill="#00ff66" />

  <!-- Tactical Hostile Target Blip (Echo Detected) -->
  <circle cx="21" cy="10.5" r="2" fill="#00e5ff" />
  <circle cx="21" cy="10.5" r="3.5" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.6" />
</svg>
