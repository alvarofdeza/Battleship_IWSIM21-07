name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-validation:
    name: Backend CI (Java 17 & Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execution permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build and execute automated test suite
        run: ./mvnw clean test -B

  frontend-validation:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint codebase
        working-directory: ./frontend
        run: npm run lint

      - name: Verify TypeScript types
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Execute Vitest unit and component tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Next.js application
        working-directory: ./frontend
        run: npm run build
